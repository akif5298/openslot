<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenSlot | Student Dashboard</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="page">
    <section class="shell">
      <header class="topbar">
        <div>
          <h1>Student Dashboard</h1>
          <p class="subtle" id="welcome"></p>
        </div>
        <nav class="nav-row">
          <a class="btn btn-link" href="my-bookings.html">My Bookings</a>
          <button class="btn-secondary" data-logout>Logout</button>
        </nav>
      </header>

      <section class="card">
        <div class="filter-row">
        <div>
            <label for="course-filter">Course</label>
            <select id="course-filter"></select>
      </div>
          <div>
            <label for="date-filter">Date</label>
            <input id="date-filter" type="date" />
    </div>
          <div>
            <label>&nbsp;</label>
            <button id="refresh-button" class="btn-primary" type="button">Refresh Slots</button>
    </div>
  </div>
        <p id="message" class="message message-info"></p>
      </section>

      <section id="slots" class="grid" style="margin-top: 14px;"></section>
    </section>
  </main>
  <script type="module" src="js/student.js"></script>
</body>
</html>
