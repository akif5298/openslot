<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenSlot | Professor Courses</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="top-nav">
      <div class="brand"><span class="brand-icon">📅</span>OpenSlot</div>
      <nav class="nav-links">
        <a href="professor-dashboard.html">Dashboard</a>
        <a href="professor-schedule.html">Schedule</a>
        <a class="active" href="professor-courses.html">Courses</a>
        <a href="professor-settings.html">Settings</a>
      </nav>
      <div class="nav-tools">
        <button class="tool-btn" title="Notifications">🔔</button>
        <div class="avatar avatar-blue" id="user-avatar">P</div>
        <button class="btn-ghost" id="logout-btn" type="button">Logout</button>
      </div>
    </header>

    <main class="page">
      <section class="card hero">
        <div class="hero-row">
          <div>
            <h1>My Courses</h1>
            <p class="subhead" id="course-count">Managing active courses this semester.</p>
          </div>
          <button class="btn-primary" type="button">+ Add Course</button>
        </div>
      </section>

      <section id="courses-grid" class="grid grid-2"></section>
    </main>

    <footer class="footer">
      <span>© 2026 OpenSlot University Scheduler</span>
      <span><a href="professor-schedule.html">View Schedule</a></span>
    </footer>
  </div>

  <script type="module" src="js/professor-courses.js"></script>
</body>
</html>
