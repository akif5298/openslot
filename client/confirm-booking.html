<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenSlot | Confirm Booking</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="top-nav">
      <div class="brand"><span class="brand-icon">📅</span>OpenSlot</div>
      <nav class="nav-links">
        <a href="student-dashboard.html">Dashboard</a>
        <a href="my-bookings.html">My Bookings</a>
        <a href="browse-slots.html">Browse Slots</a>
        <a href="support.html">Support</a>
      </nav>
      <div class="nav-tools">
        <div class="avatar" id="user-avatar">U</div>
        <button class="btn-ghost" id="logout-btn" type="button">Logout</button>
      </div>
    </header>

    <main class="page page-narrow">
      <section class="card hero hero-centered">
        <div class="hero-icon">🗓️</div>
        <h1>Confirm Your Session</h1>
        <p class="subhead">Please review the details below before completing your booking.</p>
        <p id="notice" class="notice" style="margin-top: 14px;"></p>
      </section>

      <section class="card booking-summary">
        <div class="booking-visual">
          <div class="booking-visual-icon">📘</div>
        </div>
        <div id="booking-summary-body" class="detail-stack"></div>
      </section>

      <section class="card">
        <h2>Meeting Preparation</h2>
        <p class="subhead">What do you need help with?</p>

        <form id="confirm-form" class="grid" style="margin-top: 12px;">
          <div>
            <label for="booking-notes">Notes for your professor</label>
            <textarea
              id="booking-notes"
              placeholder="Briefly describe your questions, discussion topics, or the project you are working on."
            ></textarea>
          </div>

          <div style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">
            <button class="btn-primary" id="confirm-btn" type="submit">Confirm Booking</button>
            <a class="btn-ghost" href="browse-slots.html">Go Back to Calendar</a>
          </div>
        </form>
      </section>
    </main>

    <footer class="footer">
      <span>© 2026 OpenSlot University Scheduler</span>
      <span><a href="support.html">Support</a> · <a href="support.html">Privacy</a> · <a href="support.html">Terms</a></span>
    </footer>
  </div>

  <script type="module" src="js/confirm-booking.js"></script>
</body>
</html>
