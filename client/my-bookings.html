<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>OpenSlot — My Bookings</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="container">
    <div class="nav">
      <div class="brand">OpenSlot</div>
      <div class="row">
        <span class="pill" id="who"></span>
        <button class="btn" id="backBtn">Back</button>
        <button class="btn danger" id="logoutBtn">Logout</button>
      </div>
    </div>

    <div id="notice" class="notice"></div>

    <div class="card">
      <h2>My bookings</h2>
      <table class="table">
        <thead>
          <tr>
            <th>Course</th>
            <th>Professor</th>
            <th>Time</th>
            <th>Status</th>
            <th></th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="bookingsBody"></tbody>
      </table>
      <p><small>Reschedule: use slot IDs from the Student dashboard list (Milestone 2 UI simplification).</small></p>
    </div>
  </div>

  <script type="module" src="./js/bookings.js"></script>
</body>
</html>
