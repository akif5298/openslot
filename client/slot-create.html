<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenSlot | Create Slot</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="modal-backdrop">
    <section class="modal">
      <header class="modal-head">
        <div class="section-title">
          <div>
            <h2>Create Slot</h2>
            <p class="subhead">Schedule a new availability for your students.</p>
          </div>
          <a class="btn-ghost" href="professor-dashboard.html">✕</a>
        </div>
      </header>

      <form id="slot-form">
        <div class="modal-body">
          <div class="grid grid-2">
            <div>
              <label for="date">Select Date</label>
              <input id="date" type="date" required />
            </div>
            <div>
              <label for="course_id">Course</label>
              <select id="course_id" required></select>
            </div>
          </div>

          <div class="grid grid-2">
            <div>
              <label for="start_time">Start Time</label>
              <input id="start_time" type="time" required />
            </div>
            <div>
              <label for="end_time">End Time</label>
              <input id="end_time" type="time" required />
            </div>
          </div>

          <div class="grid grid-2">
            <div>
              <label for="visibility">Slot Type</label>
              <select id="visibility">
                <option value="public">Open to Students</option>
                <option value="private">Private</option>
              </select>
            </div>
            <div>
              <label for="status">Status</label>
              <select id="status">
                <option value="posted">Post Slot</option>
                <option value="draft">Save as Draft</option>
              </select>
            </div>
          </div>

          <div>
            <label for="mode">Meeting Type</label>
            <select id="mode">
              <option value="in_person">In Person</option>
              <option value="virtual">Virtual</option>
            </select>
          </div>

          <div>
            <label for="location_or_link">Location or Meeting Link</label>
            <input id="location_or_link" placeholder="Office 402 or https://zoom.us/..." required />
          </div>

          <div>
            <label for="topic">Optional Topic</label>
            <input id="topic" placeholder="e.g., Midterm review help" />
          </div>

          <p id="message" class="message message-info"></p>
        </div>

        <footer class="modal-foot">
          <a class="btn-ghost" href="professor-dashboard.html">Cancel</a>
          <button class="btn-primary" type="submit">Post Slot</button>
        </footer>
      </form>
    </section>
  </div>

  <script type="module" src="js/slot-create.js"></script>
</body>
</html>
