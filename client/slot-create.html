<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenSlot | Create Slot</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="page">
    <section class="shell">
      <header class="topbar">
        <div>
          <h1 id="page-title">Create Availability Slot</h1>
          <p class="subtle">Draft or post office-hour slots for students.</p>
      </div>
        <nav class="nav-row">
          <a class="btn btn-link" href="professor-dashboard.html">Back to Dashboard</a>
          <button class="btn-secondary" data-logout>Logout</button>
        </nav>
      </header>

      <section class="card">
        <form id="slot-form" class="grid grid-2" novalidate>
          <div>
            <label for="course_id">Course</label>
            <select id="course_id" required></select>
    </div>
          <div>
            <label for="date">Date</label>
            <input id="date" type="date" required />
          </div>
          <div>
            <label for="start_time">Start Time</label>
            <input id="start_time" type="time" required />
          </div>
          <div>
            <label for="end_time">End Time</label>
            <input id="end_time" type="time" required />
        </div>
          <div>
            <label for="mode">Mode</label>
            <select id="mode">
              <option value="in_person">In Person</option>
              <option value="virtual">Virtual</option>
            </select>
          </div>
          <div>
            <label for="visibility">Visibility</label>
            <select id="visibility">
              <option value="public">Public</option>
              <option value="private">Private</option>
            </select>
          </div>
          <div class="grid" style="grid-column: 1 / -1;">
            <label for="location_or_link">Location or Video Link</label>
            <input id="location_or_link" type="text" placeholder="Room number or meeting URL" />
        </div>
          <div>
            <label for="status">Initial Status</label>
            <select id="status">
          <option value="draft">Draft</option>
              <option value="posted">Post immediately</option>
              <option value="cancelled">Cancelled</option>
        </select>
          </div>
          <div class="grid" style="grid-column: 1 / -1;">
            <label for="notes">Notes (optional)</label>
            <textarea id="notes" placeholder="Optional session notes"></textarea>
          </div>
          <div class="inline-actions" style="grid-column: 1 / -1;">
            <button id="submit-button" class="btn-primary" type="submit">Create Slot</button>
        </div>
      </form>
        <p id="message" class="message message-info"></p>
      </section>
    </section>
  </main>
  <script type="module" src="js/slot-create.js"></script>
</body>
</html>
